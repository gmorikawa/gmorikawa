<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting...</title>
  <script>
    (function () {
      var redirectedPath = window.location.pathname + window.location.search + window.location.hash;
      window.location.replace('/?p=' + encodeURIComponent(redirectedPath));
    })();
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
